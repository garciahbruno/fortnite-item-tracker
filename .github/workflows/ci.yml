name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tracker -d tracker_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgres://tracker:ci_password@localhost:5432/tracker_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/...
      - run: docker build -t fortnite-tracker:ci .
